name: Tests et build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer le backend
        working-directory: ./backend
        run: npm ci

      - name: Tester le backend
        working-directory: ./backend
        run: npm test

      - name: Installer le frontend
        working-directory: ./frontend
        run: npm ci

      - name: Compiler le frontend
        working-directory: ./frontend
        run: npm run build
  deploy:
    needs: test-build
    runs-on: ubuntu-latest

    # Déployer seulement lors d'un push sur main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deployer sur la VM Azure
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/JL/Lab02-Codex
            git pull origin main

            cd backend
            npm ci
            pm2 restart projet1-backend

            cd ../frontend
            npm ci
            npm run build
