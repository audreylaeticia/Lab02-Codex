name: Tests et build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer le backend
        working-directory: ./backend
        run: npm ci

      - name: Tester le backend
        working-directory: ./backend
        run: npm test

      - name: Installer le frontend
        working-directory: ./frontend
        run: npm ci

      - name: Compiler le frontend
        working-directory: ./frontend
        run: npm run build
